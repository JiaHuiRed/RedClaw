<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QiuQiu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="deepblue">
  <!-- Gradient background (theme) -->
  <div id="theme-bg"></div>
  <!-- Uploaded background image -->
  <div id="bg-layer"></div>

  <div id="app">
    <!-- Title bar (macOS style) -->
    <div class="titlebar glass">
      <div class="traffic-lights">
        <span class="tl-btn tl-close"></span>
        <span class="tl-btn tl-minimize"></span>
        <span class="tl-btn tl-maximize"></span>
      </div>
      <div class="titlebar-identity">
        <div class="titlebar-avatar" id="titlebar-avatar">&#x1F342;</div>
        <div class="titlebar-name">&#x79CB;&#x79CB;</div>
      </div>
      <div class="titlebar-actions">
        <button id="ctx-toggle" class="action-btn">&#x4E0A;&#x4E0B;&#x6587;</button>
      </div>
      <div class="titlebar-status" title="&#x70B9;&#x51FB;&#x6253;&#x5F00;&#x8BBE;&#x7F6E;">
        <span id="conn-status" class="status-dot offline"></span>
        <span id="conn-label"></span>
      </div>
    </div>

    <!-- Context panel -->
    <div id="context-panel" class="glass hidden">
      <div id="ctx-rows"></div>
    </div>

    <!-- Chat area -->
    <div id="chat-container">
      <div id="empty-state">
        <div class="empty-avatar">&#x1F342;</div>
        <div class="empty-name">&#x79CB;&#x79CB;</div>
        <div class="empty-tagline">&#x8D5B;&#x535A;&#x4EB2;&#x4EBA;&#xFF0C;&#x6709;&#x957F;&#x671F;&#x8BB0;&#x5FC6;&#x7684;&#x804A;&#x5929;&#x4F19;&#x4F34;</div>
      </div>
      <div id="messages"></div>
    </div>

    <!-- Input area -->
    <div id="input-area" class="glass">
      <div class="input-wrapper">
        <textarea id="input" placeholder="&#x8BF4;&#x70B9;&#x4EC0;&#x4E48;&#x2026;" rows="1"></textarea>
        <button id="send-btn" title="&#x53D1;&#x9001;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Settings overlay -->
  <div id="settings-overlay" class="hidden">
    <div class="settings-panel glass">
      <h3>&#x8BBE;&#x7F6E;</h3>

      <!-- Theme picker -->
      <div class="settings-group">
        <div class="settings-group-label">&#x4E3B;&#x9898;</div>
        <div class="theme-swatches">
          <button class="swatch active" data-theme="deepblue" title="&#x6DF1;&#x84DD;">
            <span class="swatch-bg" style="background:linear-gradient(135deg,#0a1628,#1a2d6e,#7c9ef8)"></span>
            <span class="swatch-name">&#x6DF1;&#x84DD;</span>
          </button>
          <button class="swatch" data-theme="night" title="&#x591C;&#x95F4;">
            <span class="swatch-bg" style="background:linear-gradient(135deg,#050507,#0c0c12,#b39dfc)"></span>
            <span class="swatch-name">&#x591C;&#x95F4;</span>
          </button>
          <button class="swatch" data-theme="day" title="&#x65E5;&#x95F4;">
            <span class="swatch-bg" style="background:linear-gradient(135deg,#bdd4ff,#e8f0fe,#3f6ef7)"></span>
            <span class="swatch-name">&#x65E5;&#x95F4;</span>
          </button>
          <button class="swatch" data-theme="warm" title="&#x7C73;&#x9EC4;&#x62A4;&#x773C;">
            <span class="swatch-bg" style="background:linear-gradient(135deg,#c8b890,#e5d5a8,#9b6e25)"></span>
            <span class="swatch-name">&#x7C73;&#x9EC4;</span>
          </button>
          <button class="swatch" data-theme="aurora" title="&#x6781;&#x5149;">
            <span class="swatch-bg" style="background:linear-gradient(135deg,#020c14,#1a0a35,#00e5a0)"></span>
            <span class="swatch-name">&#x6781;&#x5149;</span>
          </button>
        </div>
      </div>

      <label>Gateway &#x5730;&#x5740;
        <input type="text" id="cfg-gateway-url" value="ws://127.0.0.1:18789">
      </label>
      <label>&#x4F1A;&#x8BDD;&#x5BC6;&#x9470;
        <input type="text" id="cfg-session-key" value="qiuqiu">
      </label>
      <label>&#x81EA;&#x5B9A;&#x4E49;&#x5934;&#x50CF;
        <input type="file" id="cfg-avatar-img" accept="image/*">
      </label>
      <label>&#x80CC;&#x666F;&#x56FE;&#x7247;
        <input type="file" id="cfg-bg-image" accept="image/*">
      </label>
      <div class="settings-actions">
        <button id="cfg-clear-avatar">&#x6E05;&#x9664;&#x5934;&#x50CF;</button>
        <button id="cfg-clear-bg">&#x6E05;&#x9664;&#x80CC;&#x666F;</button>
        <button id="cfg-save">&#x4FDD;&#x5B58;&#x5E76;&#x91CD;&#x8FDE;</button>
        <button id="cfg-close">&#x5173;&#x95ED;</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
